<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d1220;
        color: #e6e9f2;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      p {
        font-size: 11px;
        opacity: 0.6;
        margin: 0 0 14px;
      }
      #toggle {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #ff2d95;
        color: #fff;
        transition: transform 0.05s ease;
        margin-top: 6px;
      }
      #toggle.on {
        background: #18ff38;
        color: #0d1220;
      }
      #toggle:active {
        transform: scale(0.97);
      }
      label {
        display: block;
        font-size: 11px;
        opacity: 0.7;
        margin: 14px 0 6px;
      }
      select {
        width: 100%;
        padding: 8px;
        font-size: 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1a1f33;
        color: #e6e9f2;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #ff2d95;
      }
      .note {
        margin-top: 12px;
        font-size: 10px;
        opacity: 0.45;
        line-height: 1.4;
      }
      #status {
        opacity: 0.8;
        color: #9ae6ff;
      }
    </style>
  </head>
  <body>
    <h1>Vibe Trip</h1>
    <p>Make any site trip to a song.</p>
    <label>Song</label>
    <select id="song"></select>
    <button id="toggle">Start trip</button>
    <label>Intensity</label>
    <input type="range" id="intensity" min="1" max="10" value="7" />
    <div class="note" id="status"></div>
    <div class="note">Plays the song through the tab and drives hue drift, element jumps, and a live visualizer.</div>
    <script src="songs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
